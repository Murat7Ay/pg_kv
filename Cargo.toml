[package]
name = "pg_kv"
version = "0.1.0"
edition = "2021"
description = "Redis-style key/value cache in PostgreSQL shared memory: no WAL, no MVCC bloat, enforced TTL"
license = "PostgreSQL"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.19.3"

[dev-dependencies]
pgrx-tests = "=0.19.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
