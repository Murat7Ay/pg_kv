# PG_MAJOR (15-18) picks the PostgreSQL major; SERVER_CPUS / CLIENT_CPUS set the
# CPU quotas (keep them within the machine's CPU count, e.g. 2/2 on a 4-vCPU CI runner).
services:
  pg:
    build:
      context: .
      args:
        PG_MAJOR: ${PG_MAJOR:-18}
    image: pg_kv:${PG_MAJOR:-18}
    environment:
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_kv
      - -c
      - pg_kv.max_entries=200000
      - -c
      - pg_kv.max_value_bytes=256
      - -c
      - shared_buffers=1GB
      - -c
      - max_connections=200
    volumes:
      - ./bench:/bench:ro
      - ./test:/test:ro
    cpus: ${SERVER_CPUS:-4}
    shm_size: 1g

  redis:
    image: redis:8
    # Pure cache: no RDB snapshots, no AOF, same as pg_kv's non-durable model.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    cpus: ${SERVER_CPUS:-4}

  # Benchmark clients run in their own containers so client CPU does not
  # compete with the server under test.
  pgbench:
    image: pg_kv:${PG_MAJOR:-18}
    profiles: ["bench"]
    entrypoint: ["sleep", "infinity"]
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./bench:/bench:ro
    cpus: ${CLIENT_CPUS:-3}

  redis-bench:
    image: redis:8
    profiles: ["bench"]
    entrypoint: ["sleep", "infinity"]
    cpus: ${CLIENT_CPUS:-3}
