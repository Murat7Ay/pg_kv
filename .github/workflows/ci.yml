name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust + cargo-pgrx do not depend on the PostgreSQL major: build them once and
  # share the layer cache with every matrix job.
  toolchain:
    name: Toolchain (Rust + cargo-pgrx)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and cache the toolchain stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: toolchain
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

  test:
    name: PostgreSQL ${{ matrix.pg }}
    needs: toolchain
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
    env:
      PG_MAJOR: ${{ matrix.pg }}
      SERVER_CPUS: 2
      CLIENT_CPUS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build pg_kv for PostgreSQL ${{ matrix.pg }}
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: PG_MAJOR=${{ matrix.pg }}
          tags: pg_kv:${{ matrix.pg }}
          load: true
          cache-from: |
            type=gha,scope=toolchain
            type=gha,scope=pg${{ matrix.pg }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg }}
      - name: Test suite
        run: ./test/run.sh
      - name: Server log
        if: failure()
        run: docker compose logs --tail 200 pg
